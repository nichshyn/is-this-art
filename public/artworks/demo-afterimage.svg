<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t">
  <title id="t">Untitled (Afterimage) — a demo submission awaiting review</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece9e2"/>
      <stop offset="1" stop-color="#d8d3c8"/>
    </linearGradient>
    <radialGradient id="after" cx="0.42" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#5d6f7e"/>
      <stop offset="0.45" stop-color="#8c9aa4"/>
      <stop offset="0.75" stop-color="#c9b9a8"/>
      <stop offset="1" stop-color="#e4ded2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2.6" fill="#1c1c1a" opacity="0.55"/>
    </pattern>
    <mask id="dotmask">
      <rect width="1600" height="1200" fill="black"/>
      <circle cx="820" cy="560" r="330" fill="white"/>
    </mask>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="820" cy="560" r="380" fill="url(#after)" opacity="0.9"/>
  <circle cx="820" cy="560" r="330" fill="url(#dots)" mask="url(#dotmask)" opacity="0.6"/>
  <circle cx="820" cy="560" r="330" fill="none" stroke="#5d6f7e" stroke-width="1.5" opacity="0.5"/>
  <circle cx="820" cy="560" r="210" fill="none" stroke="#8c9aa4" stroke-width="1" opacity="0.5"/>
  <rect width="1600" height="1200" filter="url(#grain)"/>
  <text x="72" y="1128" font-family="Inter, sans-serif" font-size="20" letter-spacing="6" fill="#6f6a60">UNTITLED (AFTERIMAGE) / 2025</text>
</svg>
