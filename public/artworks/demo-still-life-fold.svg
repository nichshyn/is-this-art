<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t">
  <title id="t">Still Life with a Fold — a contemporary monochrome canvas</title>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0ece3"/>
      <stop offset="0.55" stop-color="#e6e1d6"/>
      <stop offset="1" stop-color="#d9d3c6"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c2b4"/>
      <stop offset="0.5" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#bdb5a6"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="#dcd7cc"/>
  <rect x="210" y="90" width="1180" height="940" fill="url(#canvas)" filter="url(#shadow)" opacity="0.9"/>
  <rect x="210" y="90" width="1180" height="940" fill="url(#canvas)"/>
  <path d="M1110 90 L1010 1030 L1180 1030 L1230 90 Z" fill="url(#fold)" opacity="0.9"/>
  <path d="M1110 90 L1010 1030" stroke="#9f9789" stroke-width="2" opacity="0.6"/>
  <path d="M1230 90 L1180 1030" stroke="#faf7ef" stroke-width="3" opacity="0.65"/>
  <rect x="330" y="760" width="170" height="120" fill="#465f78" opacity="0.9"/>
  <rect x="330" y="760" width="170" height="120" fill="none" stroke="#1d1d1b" stroke-width="2" opacity="0.4"/>
  <rect width="1600" height="1200" filter="url(#grain)"/>
  <text x="72" y="1128" font-family="Inter, sans-serif" font-size="20" letter-spacing="6" fill="#6f6a60">STILL LIFE WITH A FOLD / 2025</text>
</svg>
