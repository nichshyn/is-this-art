<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t">
  <title id="t">Suspended Field — a minimal light installation</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e6df"/>
      <stop offset="0.62" stop-color="#d9d5cc"/>
      <stop offset="1" stop-color="#c9c4ba"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#fffdf6" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#f4edda" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f4edda" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.72" stop-color="#f2ecdd"/>
      <stop offset="1" stop-color="#ddd5c2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6f6a5f" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6f6a5f" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.055"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#wall)"/>
  <rect width="1600" height="1200" fill="url(#glow)" opacity="0.5"/>
  <path d="M0 900 L1600 840 L1600 1200 L0 1200 Z" fill="#c2bdb2" opacity="0.55"/>
  <ellipse cx="800" cy="1030" rx="420" ry="92" fill="url(#shadow)" filter="url(#soft)"/>
  <g stroke="#8e897e" stroke-width="2" opacity="0.55">
    <line x1="740" y1="0" x2="762" y2="380"/>
    <line x1="860" y1="0" x2="838" y2="380"/>
  </g>
  <circle cx="800" cy="500" r="212" fill="url(#disc)"/>
  <circle cx="800" cy="500" r="212" fill="none" stroke="#b9b2a2" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="800" cy="700" rx="150" ry="28" fill="#b7b0a1" opacity="0.25" filter="url(#soft)"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity="0.8"/>
  <text x="72" y="1128" font-family="Inter, sans-serif" font-size="20" letter-spacing="6" fill="#7d786d">SUSPENDED FIELD / 2025</text>
</svg>
