<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t">
  <title id="t">Synthetic Garden — an AI-generated abstract landscape</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18201c"/>
      <stop offset="0.55" stop-color="#2a3530"/>
      <stop offset="1" stop-color="#111614"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e6d7c4"/>
      <stop offset="0.45" stop-color="#c9a98c"/>
      <stop offset="1" stop-color="#8a6d58" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#a9c2b2"/>
      <stop offset="0.5" stop-color="#5f8172"/>
      <stop offset="1" stop-color="#385146" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#d9b7b2"/>
      <stop offset="0.5" stop-color="#a9756f"/>
      <stop offset="1" stop-color="#6d4541" stop-opacity="0"/>
    </radialGradient>
    <filter id="organic" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="5" seed="17" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="180" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="18"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="a"><feFuncA type="linear" slope="0.08"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="a" mode="overlay"/>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <g filter="url(#organic)">
    <ellipse cx="620" cy="560" rx="430" ry="330" fill="url(#blob1)" opacity="0.95"/>
    <ellipse cx="980" cy="430" rx="360" ry="290" fill="url(#blob2)" opacity="0.9"/>
    <ellipse cx="1050" cy="800" rx="400" ry="300" fill="url(#blob3)" opacity="0.78"/>
    <ellipse cx="430" cy="880" rx="300" ry="220" fill="url(#blob2)" opacity="0.5"/>
  </g>
  <g opacity="0.5" stroke="#e8e0d2" stroke-width="1" fill="none">
    <path d="M180 940 C 420 760, 600 980, 830 790 S 1240 720, 1450 840"/>
    <path d="M160 990 C 430 810, 610 1030, 850 840 S 1260 770, 1470 890" opacity="0.55"/>
  </g>
  <rect width="1600" height="1200" filter="url(#grain)"/>
  <text x="72" y="1128" font-family="Inter, sans-serif" font-size="20" letter-spacing="6" fill="#d8d2c6" opacity="0.72">SYNTHETIC GARDEN / 2025</text>
</svg>
